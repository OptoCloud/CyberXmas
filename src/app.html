<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#9e1b1b" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#6a1114" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Bringing the Christmas spirit to sysadmins and maintainers everywhere, one incident at a time." />
    <meta property="og:site_name" content="CyberXmas" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
    <script nonce="%sveltekit.nonce%">
      // Set the theme before the first paint; the rule matches src/lib/ui/theme.ts.
      (function () {
        var mode = 'auto';
        try { mode = localStorage.getItem('cyberxmas-theme') || 'auto'; } catch (e) {}
        if (mode !== 'print' && mode !== 'crt') mode = 'auto';
        var hour = new Date().getHours();
        var night = matchMedia('(prefers-color-scheme: dark)').matches || hour >= 18 || hour < 6;
        var root = document.documentElement;
        root.dataset.theme = mode === 'auto' ? (night ? 'crt' : 'print') : mode;
        root.dataset.themeMode = mode;
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
